<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-5</title>
	<style>
		body{
			font-family:sans-serif;
		}
		#colorform{
			background-color:#dfecdf;
			color: #111;
			padding:1em;width:400px;
		}
		#colorform p#info{
			background-color:white;
			color: black;
			width:300px;
			height:100px;
			padding:.5em;
		}
		
		#colorform legend{ 
			font-weight:bold;
			font-size:1.2em;
		}
	</style>
</head>
<body>

<div id="colorform">
	<legend>Choose your favorite color!</legend>
	<p><input type="radio" name="colorGroup" id="colorGroupRed" value="red" /> Red</p>
	<p><input type="radio" name="colorGroup" id="colorGroupGreen" value="green" /> Green</p>
	<p><input type="radio" name="colorGroup" id="colorGroupBlue" value="blue" /> Blue</p>
	<p><button id="colorButton" type="button">Submit</button></p>
	<p id="info"></p>
</div>

<script>

//Create value for current color selected
let currentColor = "";

//Create value for element of info box
let infoBox = document.getElementById("info");

//Create constant for the color button 
const button = document.getElementById("colorButton");

//Create value for all of the 
let radioButtons = document.querySelectorAll('input[name="colorGroup"]'	);

//Loop through each radio button
radioButtons.forEach(function (radio){
	//Add an event listener for when each button's value changes
	radio.addEventListener("change", function(e){

		//get the value of the button that was clicked
		currentColor = e.target.value;

		//Set the text in the info box to be that value
		infoBox.innerHTML = "You have chosen " + currentColor; 
	});
});
	
//On clicking the color button
button.onclick = function(){
	//Go through the list of all radio buttons
	for (let i  = 0; i < radioButtons.length; i++)
	{
		//If any of them is checked (should only be one)
		if (radioButtons[i].checked == true)
		{
			//Set that value as the currentColor
			currentColor = radioButtons[i].value;
		}
	}
	//If currentColor is not null (user has made choice), print that as their final choice
	if (currentColor != ""){
		infoBox.innerHTML = "Your FINAL CHOICE is " + currentColor;
	}
}
	
</script>
</body>
</html>
