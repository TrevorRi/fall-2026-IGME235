<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-4-HW</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["red","green","blue","purple","pink"];
let foods = ["borscht", "pierogi", "sausage", "beetroot"]; // add some foods

let colorList = document.querySelector("#colorsList");

for (let i = 0; i < 4; i++){
	let colorItem = document.createElement("li");
	colorItem.innerHTML = colors[i];
	colorList.appendChild(colorItem);
}

let foodList = document.querySelector("#foodsList");

for (const foodElement of foods){
	let foodItem = document.createElement("li");
	foodItem.innerHTML = foodElement;
	foodList.appendChild(foodItem);
}

let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu"
	}

//Creating two variables to store the list element and actual list of keys under links
let linkList = Object.keys(links);
let linkListText = document.querySelector("#linksList")

//loop through every property in links,
for (let i = 0; i < 3; i++){

	//Create an element to store the anchor for each link
	let linkAnchor = document.createElement("a");

	//Create an element for each list item
	let linkItem = document.createElement("li");

	//Create a variable to store the key currently being checked
	let currentValue = linkList[i];

	//Make the href of the anchor point to the associated website with 
	//the current value 	
	linkAnchor.href = links[currentValue];

	//Change the text of the anchor to be the key currently being checked
	linkAnchor.textContent = currentValue;

	//Append the anchor to the list item
	linkItem.appendChild(linkAnchor)

	//Then append the list item to the actual list
	linkListText.appendChild(linkItem);
}

</script>
</body>
</html>
