<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
  <title>Image Gallery</title>
   <style>
   		body {
		  font-family: "Helvetica","Arial",serif;
		  color: #333;
		  background-color: #fff;
		  margin: 1em 10%;
		}
		
		#main {
			padding-top: 30px;
			width: 400px;
			margin: 0 auto;
		}
		
   		span[data-image]{
   			transition-property: opacity;
   			transition-duration: 0.5s;
   			color: #c60;
		  	background-color: transparent;
		  	font-weight: bold;
		  	text-decoration: none;
		  	cursor: pointer;
   		}
   		
   		span[data-image]:hover{
   			opacity: 0.5;
   		}
		
		h1 {
		  color: #333;
		  background-color: transparent;
		}
		
		ul {
		  padding: 0;
		}
		
		li {
		  float: left;
		  padding: 1em;
		  list-style: none;
		}
		
		img {
		  display:block;
		  clear: both;
		  box-shadow: 7px 7px 5px #888;
		  border:1px solid #aaa;
		  transition-property: opacity;
   		transition-duration: 0.5s;
		}

		footer{
			font-size:70%;
			color:#bbb;
			text-align:center;
		}
   </style>
  
    </script>
</head>
<body>
  <section id="main">
      <h1>Snapshots</h1>
      <ul>
        <li><span data-image="cassie.jpg" title="A small, black dog">Cassie</span></li>
        <li><span data-image="seal.jpg" title="A happy seal">Seal</span></li>
        <li><span data-image="wolf.jpg" title="A vicious wolf">Wolf</span></li>
        <li><span data-image="eagle.jpg" title="A bald eagle">Eagle</span></li>
      </ul>
      <div id="imagewrapper">
        <img id="placeholder" src="images/placeholder.gif" alt="my image gallery" />
      </div>
       <p id="description">Choose an image.</p>
     <footer>
        <p>For IGME-235 Web Site Design & Implementation</p>
     </footer>
    </section>
     <script>
		let currentImage = document.getElementById("placeholder");

		/*
		Idea- 
		When span element is clicked, change src of image 
		via 
		currentImage.src = "whatever.jpg";
		*/


		//Get all elements with a data-image property
		let spanList = document.querySelectorAll('[data-image]');

		//Loop through each element in the document
		spanList.forEach(function(spanItem)
		{
			//Create event listeners for every item in the list
			spanItem.addEventListener("click",function(){
				//Get the data of the image that was clicked
				let spanItemImage = spanItem.dataset.image;

				//Change current image to be data from that image, by going into images 
				//folder and concatenating that with the image data 
				currentImage.src = "images/" + spanItemImage;
			});
		});
	</script>
	   
</body>
</html>
